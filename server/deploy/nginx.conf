# Include inside nginx's http context. Supply your own hostnames and TLS certificates.
# These upstreams assume Nginx and romsync run on the same host.
limit_req_zone $binary_remote_addr zone=romsync_enrollment:10m rate=2r/m;

server {
    listen 443 ssl;
    server_name romsync.example.com;

    ssl_certificate /etc/letsencrypt/live/romsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/romsync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prefer login; anonymous mode grants full administrative access.
    location / {
        client_max_body_size 2g;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:18777;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grpc.romsync.example.com;

    ssl_certificate /etc/letsencrypt/live/grpc.romsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grpc.romsync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 65m;
    client_body_timeout 120s;

    location = /romsync.v1.RomSync/RegisterDevice {
        limit_req zone=romsync_enrollment burst=5 nodelay;
        grpc_pass grpc://127.0.0.1:7777;
    }

    location / {
        grpc_pass grpc://127.0.0.1:7777;
        grpc_read_timeout 24h;
        grpc_send_timeout 120s;
        grpc_set_header Authorization $http_authorization;
    }
}
